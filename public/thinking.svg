  <defs
     id="defs1">
    <style>
      /* ループの全体時間を 0.5秒 に設定。
         「0個 → 1個 → 2個」の順に、33.3%（0.1667秒）ずつ均等に切り替えます。
         
         0%    〜 33.3% : 0個 (両方非表示)
         33.3% 〜 66.6% : 1個 (path2 表示、path2-6 非表示)
         66.6% 〜 100%  : 2個 (両方表示)
      */

      #path2 {
        animation: bubbleOne 0.5s infinite steps(1, end);
      }

      #path2-6 {
        animation: bubbleTwo 0.5s infinite steps(1, end);
      }

      /* 1つ目の楕円 (path2): 0個の期間（0%〜33.3%）だけ非表示、それ以降（33.3%〜100%）は表示 */
      @keyframes bubbleOne {
        0% { opacity: 0; }
        33.33% { opacity: 1; }
        100% { opacity: 1; }
      }

      /* 2つ目の楕円 (path2-6): 2個の期間（66.6%〜100%）だけ表示、それ以外は非表示 */
      @keyframes bubbleTwo {
        0% { opacity: 0; }
        66.66% { opacity: 1; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

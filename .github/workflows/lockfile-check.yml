name: Lockfile check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      # package.json の packageManager から pnpm のバージョンを取得する。
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Check dependency resolution
        run: pnpm install --frozen-lockfile --ignore-scripts

      # pnpm 自体の取得時に管理用ロック情報が更新された場合も検出する。
      - name: Check manifest and lockfile are unchanged
        run: git diff --exit-code -- package.json pnpm-lock.yaml
